:root{--paper:#FAFAF7;--panel:#fff;--ink:#1A2233;--muted:#5E6673;--line:#DCDFD8;--soft:#ECEEE8;--felt:#1E5B4B;--feltsoft:#E4EFEA;--red:#B42318;--up:#1E6B45}

.wrap{max-width:900px;margin:0 auto;padding:0 16px 48px}
header{background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0;padding:16px 0 2px}.sub{color:var(--muted);font-size:13px;padding-bottom:14px}
h2{font-size:19px;margin:22px 0 2px}h3{font-size:15px;margin:22px 0 6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;background:var(--panel)}
th{text-align:left;font-size:12px;color:var(--muted);padding:8px;border-bottom:2px solid var(--felt);position:sticky;top:0;background:var(--panel)}
td{padding:8px;border-bottom:1px solid var(--soft)}
td.n,th.n{text-align:right}.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}
tr.c{cursor:pointer}tr.c:hover td{background:var(--feltsoft)}
.pc{display:inline-block;width:24px;height:32px;border:1px solid #C9CEC6;border-radius:3px;text-align:center;font-weight:700;font-size:13px;line-height:1;padding-top:3px;background:#fff;color:#1A2233}
.pc.red{color:var(--red)}.pc .s{display:block;font-size:10px;margin-top:1px}
.nm{display:flex;align-items:center;gap:10px;font-weight:600}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:9px;background:var(--soft);color:var(--muted)}
.back{background:none;border:0;color:var(--felt);font:inherit;font-weight:600;cursor:pointer;padding:12px 0 0}
.stats{display:flex;gap:24px;flex-wrap:wrap;margin:10px 0}
.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:12px}
.up{color:var(--up)}.down{color:var(--red)}
.note{color:var(--muted);font-size:12px;margin-top:16px;line-height:1.6}
input[type=search]{width:100%;max-width:280px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;margin-top:12px}
nav.t{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:4px;overflow-x:auto}
nav.t button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.t button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--felt)}
th.s{cursor:pointer;user-select:none}th.s:hover{color:var(--ink)}th.s.on{color:var(--ink)}
h2 a{color:var(--felt);text-decoration:none;border-bottom:2px solid var(--feltsoft)}h2 a:hover{border-bottom-color:var(--felt)}
.pcard{position:relative;display:inline-block;width:48px;height:67px;border:1px solid #C9CEC6;border-radius:6px;background:#fff;color:#1A2233;box-shadow:0 1px 2px rgba(0,0,0,.12);vertical-align:middle}
.pcard.red{color:var(--red)}
.pcard .co{position:absolute;top:5px;left:6px;font-size:14px;font-weight:700;line-height:1;text-align:center}
.pcard .co i{display:block;font-style:normal;font-size:11px;line-height:1}
.pcard .co.b{top:auto;left:auto;bottom:4px;right:5px;transform:rotate(180deg)}
.pcard .pip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1;padding-top:8px}
@media(max-width:560px){td,th{padding:7px 6px;font-size:14px}}
html.embed,html.embed body{background:#fff;color:#1A2233}html.embed header{display:none}html.embed .wrap{max-width:none;padding:18px 18px 12px;background:#fff;border-radius:10px}html.embed h2:first-child{margin-top:0}

function pairsView(){

}

 const rows=sortBy(D.players.filter(p=>p.mpTotal||p.mpYear),'mps')
  .map((p,i)=>'<tr class="c" data-p="'+p.id+'"><td class="n" style="color:var(--muted)">'+(i+1)+'</td><td style="font-weight:600">'+esc(p.name)+'</td>'+
   '<td class="n"><b>'+mp(p.mpYear)+'</b></td><td class="n">'+mp(p.mpTotal)+'</td></tr>').join('');
 return tabs()+'<div class="scroll"><table><thead><tr><th class="n">#</th>'+th('mps','Player','name')+th('mps',D.year,'mpYear',1)+th('mps','All time','mpTotal',1)+
  '</tr></thead><tbody>'+rows+'</tbody></table></div>'+
  '<p class="note"><b>Awards</b> each session: '+D.awards.map((v,i)=>(i+1)+(i?'nd':'st')+' place '+v).join(', ')+' to each player in the pair. Tied pairs share the points for the places they cover. Click a column title to sort.</p>';
}
function pairPage(key){
 const [aId,bId]=key.split('|');
 const p=D.partnerships.find(x=>(x.aId===aId&&x.bId===bId)||(x.aId===bId&&x.bId===aId));
 if(!p) return list();
 const rows=p.played.map(e=>'<tr><td>'+fd(e.date)+'</td><td>'+esc(e.name)+'</td><td class="n">'+e.boards+'</td>'+
  '<td class="n">'+e.perf.toFixed(1)+'%</td><td class="n">'+e.par.toFixed(1)+'%</td>'+
  '<td class="n '+(e.perf>=e.par?'up':'down')+'">'+(e.perf-e.par>=0?'+':'')+(e.perf-e.par).toFixed(1)+'</td>'+
  '<td class="n">'+e.afterA.toFixed(2)+'</td><td class="n">'+(e.afterB!=null?e.afterB.toFixed(2):'–')+'</td>'+
  '<td class="n">'+(e.mp?mp(e.mp):'–')+'</td></tr>').join('');
 return '<button class="back" id="back">← Back</button>'+
  '<h2><a href="#'+p.aId+'">'+esc(p.a)+'</a> &amp; <a href="#'+p.bId+'">'+esc(p.b)+'</a></h2>'+
  '<div class="stats"><div class="stat"><b>'+p.grade.toFixed(2)+'</b><span>partnership grade'+(p.prov?' (provisional)':'')+'</span></div>'+
  '<div class="stat" style="align-items:flex-start">'+suited(p.rank)+'<span style="margin-top:6px">'+esc(p.rankName)+'</span></div>'+
  '<div class="stat"><b>'+p.sessions+'</b><span>sessions together</span></div>'+
  '<div class="stat"><b>'+p.boards+'</b><span>boards together</span></div></div>'+
  '<h3>Sessions together</h3>'+(rows?'<div class="scroll"><table><thead><tr><th>Date</th><th>Event</th><th class="n">Boards</th><th class="n">Score</th><th class="n">Par</th><th class="n">vs par</th>'+
   '<th class="n">'+esc(p.a.split(" ")[0])+' after</th><th class="n">'+esc(p.b.split(" ")[0])+' after</th><th class="n">MPs</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<p class="note">No sessions recorded.</p>')+
  '<p class="note">Click either name above for that player’s own grade, sessions and other partnerships. <b>Par</b> is the score expected from this pair against that night’s field. The last two columns show each player’s individual grade after the session.</p>';
}
function player(id){
 const p=D.players.find(x=>x.id===id);
 const s=p.sessions.map(e=>'<tr><td>'+fd(e.date)+'</td><td>'+esc(e.name)+'</td><td>'+esc(e.partner)+'</td><td class="n">'+e.boards+'</td>'+
  '<td class="n">'+e.perf.toFixed(1)+'%</td><td class="n">'+e.par.toFixed(1)+'%</td>'+
  '<td class="n '+(e.perf>=e.par?'up':'down')+'">'+(e.perf-e.par>=0?'+':'')+(e.perf-e.par).toFixed(1)+'</td>'+
  '<td class="n"><b>'+e.after.toFixed(2)+'</b> '+card(e.rank)+'</td><td class="n">'+(e.mp?mp(e.mp):'–')+'</td></tr>').join('');
 const pr=p.partners.map(x=>'<tr class="c" data-pair="'+p.id+'|'+x.id+'"><td>'+esc(x.name)+'</td><td class="n">'+x.sessions+'</td><td class="n">'+x.boards+'</td>'+
  '<td class="n">'+x.grade.toFixed(2)+' '+card(x.rank)+(x.prov?' <span class="tag">provisional</span>':'')+'</td></tr>').join('');
 return '<button class="back" id="back">← Back</button><h2>'+esc(p.name)+'</h2>'+
  '<div class="stats"><div class="stat"><b>'+p.grade.toFixed(2)+'</b><span>grade'+(p.prov?' (provisional)':'')+'</span></div>'+
  '<div class="stat" style="align-items:flex-start">'+suited(p.rank)+'<span style="margin-top:6px">'+esc(p.rankName)+'</span></div>'+
  '<div class="stat"><b>'+p.boards+'</b><span>boards played</span></div>'+
  '<div class="stat"><b>'+mp(p.mpTotal)+'</b><span>master points ('+mp(p.mpYear)+' in '+D.year+')</span></div></div>'+
  '<h3>Sessions</h3>'+(s?'<div class="scroll"><table><thead><tr><th>Date</th><th>Event</th><th>Partner</th><th class="n">Boards</th><th class="n">Your score</th><th class="n">Par</th><th class="n">vs par</th><th class="n">Grade after</th><th class="n">MPs</th></tr></thead><tbody>'+s+'</tbody></table></div>':'<p class="note">No sessions yet.</p>')+
  '<h3>Partnerships</h3>'+(pr?'<div class="scroll"><table><thead><tr><th>Partner</th><th class="n">Sessions</th><th class="n">Boards</th><th class="n">Partnership grade</th></tr></thead><tbody>'+pr+'</tbody></table></div>':'<p class="note">No partnerships yet.</p>')+
  '<p class="note"><b>Par</b> is the score expected from this pair against that night’s field: 50 minus the strength of the opponents plus the pair’s average grade. Beating par raises the grade. <b>Your score</b> is shown as a match-point percentage, converted from IMPs where the session was IMP scored.</p>';
}
function body(){const h=decodeURIComponent(location.hash.slice(1));
 if(h.indexOf('|')>0)return pairPage(h);
 if(h&&D.players.some(p=>p.id===h))return player(h);return tab==='pairs'?pairsView():tab==='mps'?mpsView():list();}
function render(){document.getElementById('app').innerHTML=body();if(EMBED){parent.postMessage({kbc:'scroll'},'*')}else{window.scrollTo(0,0)}setTimeout(postH,0);}
document.addEventListener('click',e=>{const sh=e.target.closest('[data-sort]');
 if(sh){const [v,k]=sh.dataset.sort.split('|');const s=SORT[v];
  if(s.k===k){s.d=-s.d}else{s.k=k;s.d=(k==='name'||k==='names')?1:-1}render();return;}
 const tb=e.target.closest('[data-t]');if(tb){tab=tb.dataset.t;if(location.hash){location.hash='';}else{render();}return;}
 const pr=e.target.closest('[data-pair]');if(pr&&!e.target.closest('a')){location.hash=pr.dataset.pair;return;}
 const tr=e.target.closest('[data-p]');if(tr&&!e.target.closest('a')){location.hash=tr.dataset.p;}
 if(e.target.id==='back'){location.hash='';}});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value.toLowerCase();const el=document.getElementById('app');el.innerHTML=list();const i=document.getElementById('q');i.value=e.target.value;i.focus();postH();}});
addEventListener('hashchange',render);render();
</script></body></html>
