<!doctype html><html lang="en"><head><meta charset="utf-8">

<title>Kuwait Bridge Club grades</title><style>
:root{--paper:#FAFAF7;--panel:#fff;--ink:#1A2233;--muted:#5E6673;--line:#DCDFD8;--soft:#ECEEE8;--felt:#1E5B4B;--feltsoft:#E4EFEA;--red:#B42318;--up:#1E6B45}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Helvetica Neue",Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 48px}
header{background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0;padding:16px 0 2px}.sub{color:var(--muted);font-size:13px;padding-bottom:14px}
h2{font-size:19px;margin:22px 0 2px}h3{font-size:15px;margin:22px 0 6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;background:var(--panel)}
th{text-align:left;font-size:12px;color:var(--muted);padding:8px;border-bottom:2px solid var(--felt);position:sticky;top:0;background:var(--panel)}
td{padding:8px;border-bottom:1px solid var(--soft)}
td.n,th.n{text-align:right}.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}
tr.c{cursor:pointer}tr.c:hover td{background:var(--feltsoft)}
.pc{display:inline-block;width:24px;height:32px;border:1px solid #C9CEC6;border-radius:3px;text-align:center;font-weight:700;font-size:13px;line-height:1;padding-top:3px;background:#fff;color:#1A2233}
.pc.red{color:var(--red)}.pc .s{display:block;font-size:10px;margin-top:1px}
.nm{display:flex;align-items:center;gap:10px;font-weight:600}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:9px;background:var(--soft);color:var(--muted)}
.back{background:none;border:0;color:var(--felt);font:inherit;font-weight:600;cursor:pointer;padding:12px 0 0}
.stats{display:flex;gap:24px;flex-wrap:wrap;margin:10px 0}
.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:12px}
.up{color:var(--up)}.down{color:var(--red)}
.note{color:var(--muted);font-size:12px;margin-top:16px;line-height:1.6}
input[type=search]{width:100%;max-width:280px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;margin-top:12px}
@media(max-width:560px){td,th{padding:7px 6px;font-size:14px}}
html.embed body{background:transparent}html.embed header{display:none}html.embed .wrap{padding-left:0;padding-right:0;padding-bottom:8px;max-width:none}
</style></head><body>

const EMBED=window.self!==window.top;if(EMBED)document.documentElement.className='embed';
function postH(){if(EMBED)try{parent.postMessage({kbc:'height',h:Math.ceil(document.documentElement.scrollHeight)+8},'*')}catch(e){}}
addEventListener('resize',postH);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const card=r=>'<span class="pc'+(/[♥♦]/.test(r)?' red':'')+'">'+esc(r.slice(0,-1))+'<span class="s">'+r.slice(-1)+'</span></span>';
const mp=n=>Math.abs(n-Math.round(n))<0.01?String(Math.round(n)):n.toFixed(1);
const fd=iso=>{const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
let q='';
function list(){
 const rows=D.players.filter(p=>!q||p.name.toLowerCase().includes(q)).map((p,i)=>
  '<tr class="c" data-p="'+p.id+'"><td class="n" style="color:var(--muted)">'+(i+1)+'</td>'+
  '<td><div class="nm">'+card(p.rank)+esc(p.name)+'</div></td>'+
  '<td class="n"><b>'+p.grade.toFixed(2)+'</b></td><td>'+esc(p.rankName)+(p.prov?' <span class="tag">provisional</span>':'')+'</td>'+
  '<td class="n">'+p.boards+'</td><td class="n">'+mp(p.mpYear)+'</td><td class="n">'+mp(p.mpTotal)+'</td></tr>').join('');
 return '<h2>Grades</h2><input type="search" id="q" placeholder="Find your name" value="'+esc(q)+'">'+
  '<div class="scroll"><table><thead><tr><th class="n">#</th><th>Player</th><th class="n">Grade</th><th>Rank</th><th class="n">Boards</th><th class="n">'+D.year+' MPs</th><th class="n">Total MPs</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
  '<p class="note"><b>Grade</b> is the percentage you would expect to score at match-pointed pairs with a partner of your own grade against an average field; 50 is average. <b>Rank</b> is one card per percentage point, from 2♣ at 21% or less up to A♠ at 71% and above. <b>Provisional</b> means the grade is not settled yet: it needs '+D.minBoards+' boards. <b>Master points</b>: '+D.awards.map((v,i)=>(i+1)+(i?'nd':'st')+' place '+v).join(', ')+' per session. Click any name for that player’s sessions and partnerships.</p>';
}
function player(id){
 const p=D.players.find(x=>x.id===id);
 const s=p.sessions.map(e=>'<tr><td>'+fd(e.date)+'</td><td>'+esc(e.name)+'</td><td>'+esc(e.partner)+'</td><td class="n">'+e.boards+'</td>'+
  '<td class="n">'+e.perf.toFixed(1)+'%</td><td class="n">'+e.par.toFixed(1)+'%</td>'+
  '<td class="n '+(e.perf>=e.par?'up':'down')+'">'+(e.perf-e.par>=0?'+':'')+(e.perf-e.par).toFixed(1)+'</td>'+
  '<td class="n"><b>'+e.after.toFixed(2)+'</b> '+card(e.rank)+'</td><td class="n">'+(e.mp?mp(e.mp):'–')+'</td></tr>').join('');
 const pr=p.partners.map(x=>'<tr><td>'+esc(x.name)+'</td><td class="n">'+x.sessions+'</td><td class="n">'+x.boards+'</td>'+
  '<td class="n">'+x.grade.toFixed(2)+' '+card(x.rank)+(x.prov?' <span class="tag">provisional</span>':'')+'</td></tr>').join('');
 return '<button class="back" id="back">← All players</button><h2>'+esc(p.name)+'</h2>'+
  '<div class="stats"><div class="stat"><b>'+p.grade.toFixed(2)+'</b><span>grade'+(p.prov?' (provisional)':'')+'</span></div>'+
  '<div class="stat"><b>'+p.rank+'</b><span>'+esc(p.rankName)+'</span></div>'+
  '<div class="stat"><b>'+p.boards+'</b><span>boards played</span></div>'+
  '<div class="stat"><b>'+mp(p.mpTotal)+'</b><span>master points ('+mp(p.mpYear)+' in '+D.year+')</span></div></div>'+
  '<h3>Sessions</h3>'+(s?'<div class="scroll"><table><thead><tr><th>Date</th><th>Event</th><th>Partner</th><th class="n">Boards</th><th class="n">Your score</th><th class="n">Par</th><th class="n">vs par</th><th class="n">Grade after</th><th class="n">MPs</th></tr></thead><tbody>'+s+'</tbody></table></div>':'<p class="note">No sessions yet.</p>')+
  '<h3>Partnerships</h3>'+(pr?'<div class="scroll"><table><thead><tr><th>Partner</th><th class="n">Sessions</th><th class="n">Boards</th><th class="n">Partnership grade</th></tr></thead><tbody>'+pr+'</tbody></table></div>':'<p class="note">No partnerships yet.</p>')+
  '<p class="note"><b>Par</b> is the score expected from this pair against that night’s field: 50 minus the strength of the opponents plus the pair’s average grade. Beating par raises the grade. <b>Your score</b> is shown as a match-point percentage, converted from IMPs where the session was IMP scored.</p>';
}
function render(){document.getElementById('app').innerHTML=location.hash.slice(1)?player(location.hash.slice(1)):list();if(EMBED){parent.postMessage({kbc:'scroll'},'*')}else{window.scrollTo(0,0)}setTimeout(postH,0);}

document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value.toLowerCase();const el=document.getElementById('app');el.innerHTML=list();const i=document.getElementById('q');i.value=e.target.value;i.focus();postH();}});
addEventListener('hashchange',render);render();
